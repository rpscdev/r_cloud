server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
        try_files $uri =404;
    }
}
