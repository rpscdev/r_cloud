limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# HTTP: redirect to HTTPS + serve ACME challenge for Certbot
server {
    listen 80;
    server_name raghvendra.cloud www.raghvendra.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name raghvendra.cloud www.raghvendra.cloud;
    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/raghvendra.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raghvendra.cloud/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    set $frontend_upstream frontend:80;
    set $backend_upstream  backend:8000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cloud.umami.is; connect-src 'self' https://cloud.umami.is; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $server_name;

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    location ~* ^/assets/ {
        proxy_pass http://$frontend_upstream;
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
    }

    location = /api/metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://$backend_upstream/metrics;
        proxy_redirect off;
    }

    location = /api/ai/internal {
        return 301 /api/ai/internal/;
    }

    location /api/ai/internal/ {
        limit_req  zone=api_limit burst=15 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://$backend_upstream;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /ai/internal {
        return 301 /ai/internal/;
    }

    location /ai/internal/ {
        limit_req  zone=api_limit burst=15 nodelay;
        limit_conn conn_limit 10;
        rewrite ^/ai/internal/(.*)$ /api/ai/internal/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        limit_req  zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_redirect off;
    }
}
