server {
    listen 80;
    server_name raghvendra.cloud www.raghvendra.cloud;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name raghvendra.cloud www.raghvendra.cloud;

    # SSL Certificate Paths (Ensure these are mounted as volumes in Docker)
    ssl_certificate /etc/letsencrypt/live/raghvendra.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raghvendra.cloud/privkey.pem;

    # Recommended SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Proxy headers shared by both locations
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend - React
    location / {
        proxy_pass http://react_frontend:80;
        # For React Router (SPAs) to handle deep links
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # Backend - FastAPI
    location /api {
        # Using a trailing slash in proxy_pass can affect path stripping
        proxy_pass http://fast_backend:8000;
        
        # Necessary for FastAPI to generate correct documentation (OpenAPI) URLs
        proxy_redirect off;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}
